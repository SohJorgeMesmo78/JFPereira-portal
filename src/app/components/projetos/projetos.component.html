<section class="projetos-section section-container">
  <h2 class="section-title">Projetos em Destaque</h2>
  <p class="section-subtitle">Aplicações reais desenvolvidas com foco em arquitetura limpa, alta performance e experiência do usuário.</p>

  <!-- Carousel Wrapper with Left & Right Nav Arrows -->
  <div class="carousel-wrapper">
    <!-- Left Chevron Arrow -->
    <button *ngIf="showNavButtons" (click)="mudarProjeto('prev')" class="side-nav-btn prev-btn" title="Projeto Anterior" aria-label="Projeto Anterior">
      <i class="fas fa-chevron-left"></i>
    </button>

    <!-- Projects Grid -->
    <div class="projetos-grid">
      <article class="projeto-card glass-card" *ngFor="let projeto of projetosVisiveis; trackBy: trackByProjeto">
        <!-- Project Image Preview -->
        <a class="imagem-container" [href]="projeto.site" target="_blank" rel="noopener noreferrer"
          [attr.aria-label]="'Abrir demonstração de ' + projeto.nome">
          <img *ngIf="projeto.imagem; else projectPlaceholder" [src]="projeto.imagem" [alt]="'Captura de tela do projeto ' + projeto.nome" class="imagem-projeto" />
          <ng-template #projectPlaceholder>
            <span class="project-placeholder" aria-hidden="true">
              <i class="fas fa-code"></i>
              <span>{{ projeto.nome }}</span>
            </span>
          </ng-template>
          <div class="image-overlay">
            <span class="view-btn">
              <i class="fas fa-external-link-alt"></i> Visualizar Ao Vivo
            </span>
          </div>
        </a>

        <!-- Project Content -->
        <div class="card-content">
          <h3 class="projeto-titulo">{{ projeto.nome }}</h3>
          <p class="projeto-descricao">{{ projeto.descricao }}</p>

          <ul class="tecnologias-lista" [attr.aria-label]="'Tecnologias usadas em ' + projeto.nome">
            <li *ngFor="let tecnologia of projeto.tecnologias">{{ tecnologia }}</li>
          </ul>

          <!-- Code & Live Links -->
          <div class="links-container">
            <!-- Frontend Group -->
            <div class="link-group">
              <span class="group-label">Frontend</span>
              <div class="action-buttons">
                <a [href]="projeto.github" target="_blank" rel="noopener noreferrer" aria-label="Ver código do frontend no GitHub" title="Código GitHub Frontend" class="action-btn">
                  <i class="fab fa-github"></i>
                </a>
                <a [href]="projeto.site" target="_blank" rel="noopener noreferrer" aria-label="Acessar aplicação" title="Acessar Aplicação" class="action-btn active-btn">
                  <i class="fas fa-globe"></i>
                </a>
              </div>
            </div>

            <!-- Backend Group (if available) -->
            <div class="link-group" *ngIf="projeto.backend || projeto.backendSite">
              <span class="group-label">Backend</span>
              <div class="action-buttons">
                <a *ngIf="projeto.backend" [href]="projeto.backend" target="_blank" rel="noopener noreferrer" aria-label="Ver código do backend no GitHub" title="Código GitHub Backend" class="action-btn">
                  <i class="fab fa-github"></i>
                </a>
                <a *ngIf="projeto.backendSite" [href]="projeto.backendSite" target="_blank" rel="noopener noreferrer" aria-label="Acessar API ou documentação do backend" title="API / Backend Docs" class="action-btn">
                  <i class="fas fa-server"></i>
                </a>
              </div>
            </div>
          </div>
        </div>
      </article>
    </div>

    <!-- Right Chevron Arrow -->
    <button *ngIf="showNavButtons" (click)="mudarProjeto('next')" class="side-nav-btn next-btn" title="Próximo Projeto" aria-label="Próximo Projeto">
      <i class="fas fa-chevron-right"></i>
    </button>
  </div>

  <!-- Bottom Navigation Status Badge -->
  <div class="nav-container" *ngIf="showNavButtons">
    <button (click)="mudarProjeto('prev')" class="nav-btn-bottom" aria-label="Projeto Anterior">
      <i class="fas fa-chevron-left"></i> Anterior
    </button>

    <span class="projetos-intervalo badge-pill">
      {{ projetosIntervalo }}
    </span>

    <button (click)="mudarProjeto('next')" class="nav-btn-bottom" aria-label="Próximo Projeto">
      Próximo <i class="fas fa-chevron-right"></i>
    </button>
  </div>
</section>
