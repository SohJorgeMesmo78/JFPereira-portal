<section class="formacoes-section section-container">
  <h2 class="section-title">Formação Acadêmica e Certificações</h2>
  <p class="section-subtitle">Minha base de conhecimentos acadêmicos e qualificações técnicas.</p>

  <div class="formacoes-grid">
    <article class="formacao-card glass-card" *ngFor="let formacao of formacoes">
      <div class="card-header">
        <div class="logo-wrapper">
          <img [src]="getIcone(formacao)" [alt]="formacao.nome" class="formacao-logo" />
        </div>
        <div class="header-text">
          <span class="tipo-badge badge-pill">{{ formacao.tipoFormacao }}</span>
          <h3 class="formacao-nome">{{ formacao.nome }}</h3>
        </div>
      </div>

      <div class="card-footer">
        <div class="periodo-info">
          <i class="far fa-calendar-alt" aria-hidden="true"></i>
          <span>
            <time [attr.datetime]="formacao.dataInicio">{{ formacao.dataInicio }}</time>
            —
            <time [attr.datetime]="formacao.dataFim">{{ formacao.dataFim }}</time>
          </span>
        </div>
        <p class="descricao" *ngIf="formacao.descricao">{{ formacao.descricao }}</p>
      </div>
    </article>
  </div>
</section>
