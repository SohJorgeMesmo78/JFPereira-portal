<mat-toolbar class="navbar-toolbar" [ngClass]="{ 'scrolled': isScrolled }">
  <div class="nav-container">
    <!-- Brand / Profile Avatar (Shrinks in header when scrolled) -->
    <a href="#perfil" (click)="closeMenu()" class="brand-logo" [ngClass]="{ 'visible': isScrolled }">
      <div class="avatar-ring">
        <img src="assets/images/Perfil.jpg" alt="Foto de Jorge Fernando" class="brand-avatar" />
      </div>
      <div class="brand-text">
        <span class="brand-name">Jorge Fernando</span>
        <span class="brand-title">Full Stack Developer</span>
      </div>
    </a>

    <!-- Navigation Links -->
    <nav #menuLinks id="primary-navigation" class="menu-links" [ngClass]="{ 'open': isMenuOpen }" aria-label="Navegação principal">
      <a mat-button href="#perfil" (click)="closeMenu()">
        <i class="fas fa-user-circle" aria-hidden="true"></i> Perfil
      </a>
      <a mat-button href="#habilidades-tecnicas" (click)="closeMenu()">
        <i class="fas fa-code" aria-hidden="true"></i> Habilidades
      </a>
      <a mat-button href="#experiencias-profissionais" (click)="closeMenu()">
        <i class="fas fa-briefcase" aria-hidden="true"></i> Experiências
      </a>
      <a mat-button href="#formacoes" (click)="closeMenu()">
        <i class="fas fa-graduation-cap" aria-hidden="true"></i> Formações
      </a>
      <a mat-button href="#projetos" (click)="closeMenu()">
        <i class="fas fa-laptop-code" aria-hidden="true"></i> Projetos
      </a>
      <a mat-button href="#contatos" (click)="closeMenu()">
        <i class="fas fa-envelope" aria-hidden="true"></i> Contatos
      </a>
    </nav>

    <!-- Right Controls: Theme Toggle & Hamburger -->
    <div class="nav-controls">
      <button #themeButton type="button" class="theme-toggle-btn" (click)="toggleDropdown()"
        aria-controls="theme-menu" [attr.aria-expanded]="isDropdownOpen" title="Alternar tema">
        <i class="fas fa-palette" aria-hidden="true"></i>
        <span class="theme-label">Tema</span>
        <i class="fas fa-chevron-down arrow-icon" aria-hidden="true" [ngClass]="{'rotated': isDropdownOpen}"></i>
      </button>

      <!-- Theme Dropdown Menu -->
      <div #themeMenu id="theme-menu" class="theme-dropdown glass-card" *ngIf="isDropdownOpen">
        <ul>
          <li>
            <button type="button" (click)="changeTheme('dark-theme')" [attr.aria-pressed]="isCurrentTheme('dark-theme')">
              <span class="theme-preview dark-preview" aria-hidden="true"></span>
              <span>Tema Escuro</span>
            </button>
          </li>
          <li>
            <button type="button" (click)="changeTheme('light-theme')" [attr.aria-pressed]="isCurrentTheme('light-theme')">
              <span class="theme-preview light-preview" aria-hidden="true"></span>
              <span>Tema Claro</span>
            </button>
          </li>
        </ul>
      </div>

      <!-- Mobile Hamburger Button -->
      <button #hamburgerButton type="button" class="hamburger-menu" (click)="toggleMenu()"
        aria-controls="primary-navigation" [attr.aria-expanded]="isMenuOpen"
        [attr.aria-label]="isMenuOpen ? 'Fechar menu' : 'Abrir menu'">
        <i class="fas" aria-hidden="true" [ngClass]="isMenuOpen ? 'fa-times' : 'fa-bars'"></i>
      </button>
    </div>
  </div>
</mat-toolbar>
